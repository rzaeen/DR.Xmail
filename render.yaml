# Render.com free deployment for DR.Xmail federated node
# Deploy: https://dashboard.render.com -> New -> Blueprint -> connect GitHub repo
services:
  - type: web
    name: drxmail-node
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m drxmail.agents.fedinode
    envVars:
      - key: PORT
        sync: false
      - key: FEDIMAIL_BASE
        sync: false
      - key: FEDIMAIL_DIR
        sync: false